name: Build APK
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Capacitor project
        run: |
          mkdir -p ../app && cd ../app
          npm init -y >/dev/null
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6 @capacitor/app@6 @capacitor/share@6 @capacitor/filesystem@6 @capacitor-community/speech-recognition@6.0.1
          mkdir www && cp $GITHUB_WORKSPACE/index.html www/index.html
          cp $GITHUB_WORKSPACE/manifest.json www/manifest.json || true
          npx cap init "مساعد الأسد" com.asad.tasks --web-dir www
          npx cap add android
      - name: Configure Android
        run: |
          cd ../app/android
          APP=app/src/main
          mkdir -p $APP/res/raw $APP/res/xml $APP/java/com/asad/tasks
          python3 - <<'EOF'
          import wave,struct,math
          def wav(name,notes,vol=.8):
              sr=22050;fr=[]
              for f,d in notes:
                  n=int(sr*d)
                  for i in range(n):
                      e=min(1,i/300)*max(0,1-i/n)**1.5
                      fr.append(int(32000*vol*e*(math.sin(2*math.pi*f*i/sr)+.3*math.sin(4*math.pi*f*i/sr))/1.3) if f else 0)
              w=wave.open('app/src/main/res/raw/'+name+'.wav','wb');w.setnchannels(1);w.setsampwidth(2);w.setframerate(sr);w.writeframes(struct.pack('<%dh'%len(fr),*fr));w.close()
          wav('prayer_bell',[(523,.5),(659,.5),(784,.5),(1046,1.2)])
          wav('task_alarm',[(880,.15),(0,.08),(880,.15),(0,.08),(880,.15),(0,.3),(988,.15),(0,.08),(988,.15),(0,.08),(988,.15)])
          wav('routine_soft',[(659,.35),(784,.6)],.5)
          wav('pre_chime',[(1047,.25),(1319,.45)],.5)
          EOF
          cp $GITHUB_WORKSPACE/shortcuts.xml $APP/res/xml/
          cp $GITHUB_WORKSPACE/AsadNative.java $APP/java/com/asad/tasks/
          cat > $APP/java/com/asad/tasks/MainActivity.java <<'EOF'
          package com.asad.tasks;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            @Override public void onCreate(Bundle b) { registerPlugin(AsadNative.class); super.onCreate(b); }
          }
          EOF
          python3 - <<'EOF'
          import re
          p='app/src/main/AndroidManifest.xml'; s=open(p,encoding='utf8').read()
          perms=['POST_NOTIFICATIONS','SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','RECEIVE_BOOT_COMPLETED','VIBRATE','READ_CONTACTS','RECORD_AUDIO','WAKE_LOCK','REQUEST_IGNORE_BATTERY_OPTIMIZATIONS','QUERY_ALL_PACKAGES']
          add=''.join('<uses-permission android:name="android.permission.%s" />\n    '%x for x in perms)
          s=s.replace('<application',add+'<application',1)
          s=s.replace('<intent-filter>','<intent-filter><action android:name="android.intent.action.VIEW" /><category android:name="android.intent.category.DEFAULT" /><category android:name="android.intent.category.BROWSABLE" /><data android:scheme="asad" /></intent-filter>\n            <intent-filter>',1)
          s=re.sub(r'(<activity[^>]*MainActivity[^>]*?)(>)',r'\1 android:launchMode="singleTask"\2',s,1)
          s=s.replace('</activity>','<meta-data android:name="android.app.shortcuts" android:resource="@xml/shortcuts" /></activity>',1)
          open(p,'w',encoding='utf8').write(s)
          open('app/src/main/res/values/shortcut_strings.xml','w',encoding='utf8').write('<resources><string name="sc_voice">مساعد صوتي</string><string name="sc_tasks">مهام اليوم</string><string name="sc_plan">مهام الغد</string></resources>')
          EOF
      - name: Icons
        run: |
          cd ../app/android/app/src/main/res
          python3 - <<'EOF'
          import json,base64,os
          m=json.load(open(os.environ['GITHUB_WORKSPACE']+'/manifest.json'))
          best={}
          for i in m['icons']:
              if i['src'].startswith('data:'): best[(i['sizes'],i.get('purpose','any'))]=base64.b64decode(i['src'].split(',')[1])
          big=best.get(('512x512','any')) or list(best.values())[-1]
          sizes={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          for d in sizes:
              for n in ('ic_launcher.png','ic_launcher_round.png','ic_launcher_foreground.png'):
                  open(f'mipmap-{d}/{n}','wb').write(big)
          EOF
          rm -rf mipmap-anydpi-v26 || true
      - name: Signing key and build
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore
          cd ../app/android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk $GITHUB_WORKSPACE/asad.apk
      - uses: actions/upload-artifact@v4
        with:
          name: asad-apk
          path: asad.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: APK-latest
          files: asad.apk
