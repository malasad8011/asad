<title>مهام الأسد الذكي</title>
<meta name="theme-color" content="#0B3B3C">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600&display=swap">
<style>
/* تصميم: شبكة هادئة بألوان الزمرد والنحاس الذهبي، ورق مقوّى فاتح وليل أخضر داكن */
:root {
  --bg: #EDF2F0; --surface: #FFFFFF; --surface2: #E3EBE8; --ink: #12272A; --muted: #587074; --line: #D0DCD9;
  --accent: #0B7A6E; --accent-ink: #FFFFFF; --accent-soft: #D5EEE9; --brass: #A97A1F; --brass-soft: #F3E7C9;
  --ok: #17803D; --warn: #C2410C; --danger: #B42318;
  --c-prayer: #A97A1F; --c-faith: #0B7A6E; --c-work: #3A6FA8; --c-family: #B0486A; --c-growth: #6D55C0; --c-general: #6B7F83;
  --hero1: #0B3B3C; --hero2: #0F6B63; --hero-ink: #EAF6F3; --shadow: 0 1px 2px rgba(18,39,42,.06), 0 6px 18px rgba(18,39,42,.07);
  --f-display: 'Reem Kufi', 'Segoe UI', Tahoma, sans-serif; --f-body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1415; --surface: #11201F; --surface2: #172B2B; --ink: #E3EFEC; --muted: #8DA8AA; --line: #223A3A;
    --accent: #36C6AE; --accent-ink: #052019; --accent-soft: #123B37; --brass: #E3B95C; --brass-soft: #3A2F14;
    --ok: #4ADE80; --warn: #FB923C; --danger: #F87171;
    --c-prayer: #E3B95C; --c-faith: #36C6AE; --c-work: #7DB0E6; --c-family: #E88AA8; --c-growth: #A895F2; --c-general: #8DA8AA;
    --hero1: #0E3535; --hero2: #14685F; --hero-ink: #EAF6F3; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1415; --surface: #11201F; --surface2: #172B2B; --ink: #E3EFEC; --muted: #8DA8AA; --line: #223A3A;
  --accent: #36C6AE; --accent-ink: #052019; --accent-soft: #123B37; --brass: #E3B95C; --brass-soft: #3A2F14;
  --ok: #4ADE80; --warn: #FB923C; --danger: #F87171;
  --c-prayer: #E3B95C; --c-faith: #36C6AE; --c-work: #7DB0E6; --c-family: #E88AA8; --c-growth: #A895F2; --c-general: #8DA8AA;
  --hero1: #0E3535; --hero2: #14685F; --hero-ink: #EAF6F3; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 22px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; direction: rtl; text-align: right; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }

<script>
/* ====== منطق التطبيق: مواقيت الصلاة، الجدول، المحلل العربي، الورد ====== */
const D2R = Math.PI / 180, R2D = 180 / Math.PI;
const fixA = a => ((a % 360) + 360) % 360;
const fixH = h => ((h % 24) + 24) % 24;
const sinD = x => Math.sin(x * D2R), cosD = x => Math.cos(x * D2R), tanD = x => Math.tan(x * D2R);
const asinD = x => Math.asin(x) * R2D, acosD = x => Math.acos(x) * R2D, atan2D = (y, x) => Math.atan2(y, x) * R2D, acotD = x => Math.atan(1 / x) * R2D;

const CITIES = {
  riyadh: ['الرياض', 24.7136, 46.6753, 3], jeddah: ['جدة', 21.4858, 39.1925, 3], makkah: ['مكة المكرمة', 21.3891, 39.8579, 3],
  madinah: ['المدينة المنورة', 24.5247, 39.5692, 3], dammam: ['الدمام', 26.4207, 50.0888, 3], khobar: ['الخبر', 26.2172, 50.1971, 3],
  hofuf: ['الأحساء', 25.3647, 49.5878, 3], taif: ['الطائف', 21.2703, 40.4158, 3], abha: ['أبها', 18.2164, 42.5053, 3],
  khamis: ['خميس مشيط', 18.3093, 42.7299, 3], tabuk: ['تبوك', 28.3838, 36.5662, 3], buraidah: ['بريدة', 26.326, 43.975, 3],
  hail: ['حائل', 27.5114, 41.7208, 3], jazan: ['جازان', 16.8892, 42.5511, 3], najran: ['نجران', 17.4917, 44.1322, 3],
  baha: ['الباحة', 20.0129, 41.4677, 3], jubail: ['الجبيل', 27.0046, 49.646, 3], yanbu: ['ينبع', 24.0895, 38.0618, 3],
  sakaka: ['سكاكا', 29.9697, 40.2064, 3], arar: ['عرعر', 30.9753, 41.0381, 3],
  sanaa: ['صنعاء', 15.3694, 44.191, 3], aden: ['عدن', 12.7855, 45.0187, 3],
  custom: ['موقع مخصص', 24.7136, 46.6753, 3]

function julian(y, m, d) {
  if (m <= 2) { y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + B - 1524.5;
}
function sunPos(jd) {
  const D = jd - 2451545.0, g = fixA(357.529 + 0.98560028 * D), q = fixA(280.459 + 0.98564736 * D);
  const L = fixA(q + 1.915 * sinD(g) + 0.020 * sinD(2 * g)), e = 23.439 - 0.00000036 * D;
  const RA = atan2D(cosD(e) * sinD(L), cosD(L)) / 15;
  return { decl: asinD(sinD(e) * sinD(L)), eqt: q / 15 - fixH(RA) };
}

/* حساب المواقيت (طريقة أم القرى: الفجر 18.5°، العشاء بعد المغرب بـ 90 دقيقة، 120 في رمضان) */
function calcPrayers(y, m, d, lat, lng, tz, opt = {}) {
  const fajrAng = opt.fajrAngle ?? 18.5, ishaMin = opt.ishaMin ?? 90, asrF = opt.asrFactor ?? 1;
  const jd = julian(y, m, d) - lng / (15 * 24), rs = 0.833;
  const mid = t => fixH(12 - sunPos(jd + t).eqt);
  const ang = (a, t, ccw) => {
    const dec = sunPos(jd + t).decl, noon = mid(t);
    const c = (-sinD(a) - sinD(dec) * sinD(lat)) / (cosD(dec) * cosD(lat));
    const tt = acosD(Math.max(-1, Math.min(1, c))) / 15;
    return noon + (ccw ? -tt : tt);
  };
  const asr = (f, t) => { const dec = sunPos(jd + t).decl; return ang(-acotD(f + tanD(Math.abs(lat - dec))), t, false); };
  const P = { fajr: 5 / 24, sunrise: 6 / 24, dhuhr: 12 / 24, asr: 13 / 24, maghrib: 18 / 24 };
  const r = {
    fajr: ang(fajrAng, P.fajr, true), sunrise: ang(rs, P.sunrise, true), dhuhr: mid(P.dhuhr),
    asr: asr(asrF, P.asr), maghrib: ang(rs, P.maghrib, false)
  };
  const adj = tz - lng / 15, out = {};
  for (const k in r) out[k] = fixH(r[k] + adj);
  out.dhuhr += (opt.dhuhrMin ?? 1) / 60;
  out.maghrib += (opt.maghribMin ?? 1) / 60;
  out.isha = out.maghrib + ishaMin / 60;
  const res = {};
  for (const k in out) res[k] = Math.round(out[k] * 60 + (opt.round ?? 0.5)); // دقائق من منتصف الليل
  return res;
}

/* ====== التاريخ والوقت حسب توقيت المدينة ====== */
const pad = n => String(n).padStart(2, '0');

const dateKey = o => `${o.y}-${pad(o.m)}-${pad(o.d)}`;

/* ====== الجدول اليومي ====== */
const PRAYER_NAMES = { fajr: 'الفجر', dhuhr: 'الظهر', asr: 'العصر', maghrib: 'المغرب', isha: 'العشاء' };
const DEFAULT_SETTINGS = {
  city: 'riyadh', lat: 24.7136, lng: 46.6753, tz: 3,

/* dayType: 'install' = تركيبات | 'free' = صباح فاضي | 'off' = إجازة */
function buildDay(k, S, dayType) {
  const P = prayersFor(k, S), se = seasonOf(k, S), wd = weekday(k);
  const school = S.schoolDays.includes(wd) && dayType !== 'off';
  const B = [];
  const add = (key, t, title, cat, extra = {}) => B.push({ key, t: Math.round(t), title, cat, ...extra });
  const wake = toMin(S.wake[se]);
  add('wake', wake, 'الاستيقاظ والوضوء', 'faith', { alert: 'wake' });
  add('fajr', P.fajr, 'صلاة الفجر', 'prayer', { prayer: 'fajr' });
  add('adhkar', P.fajr + 12, 'أذكار الصباح', 'faith');
  add('wird', P.fajr + 25, 'ورد القرآن مع التفسير', 'faith', { alert: 'wird', link: 'wird' });
  add('sunrise', P.sunrise, 'الشروق', 'info', { info: true });
  add('duha', P.sunrise + 20, 'صلاة الضحى (نافلة)', 'prayer', { optional: true });
  let free0 = P.sunrise + 45;
  let dropEnd = null;
  if (school) {
    const dr = toMin(S.drop[se]);
    add('drop', dr, 'توصيل الولد للمدرسة', 'family', { alert: 'pick', dur: S.driveMin });
    dropEnd = dr + S.driveMin;
    free0 = Math.max(free0, dropEnd + 5);
    const pk = toMin(S.pick[se]);
    add('pick', pk - 10, 'الذهاب لإحضار الولد من المدرسة', 'family', { alert: 'pick', dur: S.driveMin + 10 });
  }
  const pickAt = school ? toMin(S.pick[se]) - 10 : null;
  const noonCut = pickAt ?? (P.dhuhr - 5);
  if (dayType === 'install') {
    add('install', dropEnd ?? free0, 'تركيبات الديكور (موقع العمل)', 'work', { dur: Math.max(30, noonCut - (dropEnd ?? free0)), span: true });
  } else if (dayType === 'free') {
    add('learn_am', free0, 'وقت التطوير: تعلّم وقراءة', 'growth', { dur: 60, link: 'growth' });
    add('suppliers_am', free0 + 70, 'تواصل مع المصانع والموردين', 'work', { dur: 40, link: 'suppliers' });
    add('home', free0 + 120, 'مهام البيت والإصلاحات', 'general', { dur: 60 });
  }
  add('dhuhr', P.dhuhr, 'صلاة الظهر', 'prayer', { prayer: 'dhuhr' });
  if (dayType !== 'install') add('nap', Math.max(P.dhuhr + 40, (pickAt ?? 0) + 40), 'قيلولة قصيرة (٢٠–٣٠ دقيقة)', 'general', { optional: true, dur: 25 });
  if (dayType !== 'off') {
    add('lunch', toMin(S.lunch), 'الغداء', 'general', { dur: 30 });
    add('leave', toMin(S.leave), 'التجهّز للعصر والذهاب للدوام', 'work', { alert: 'work' });
  } else {
    add('lunch', toMin(S.lunch), 'الغداء', 'general', { dur: 30 });
  }
  add('asr', P.asr, 'صلاة العصر', 'prayer', { prayer: 'asr' });
  if (dayType !== 'off') {
    add('office', toMin(S.workStart), 'الدوام في معرض الديكور', 'work', { span: true, dur: toMin(S.workEnd) - toMin(S.workStart) });
    add('quotes', toMin(S.workStart) + 15, 'متابعة العملاء وعروض الأسعار', 'work', { dur: 45 });
  } else {
    add('rest', P.asr + 30, 'وقت للعائلة والراحة', 'family', { dur: 90 });
  }
  add('maghrib', P.maghrib, 'صلاة المغرب', 'prayer', { prayer: 'maghrib' });
  add('learn_pm', P.maghrib + 25, 'ساعة تطوير مهارات', 'growth', { dur: 45, link: 'growth' });
  add('isha', P.isha, 'صلاة العشاء', 'prayer', { prayer: 'isha' });
  add('suppliers_pm', P.isha + 25, 'مراسلة المصانع وطلب الكتالوجات', 'work', { dur: 40, link: 'suppliers' });
  add('family', P.isha + 70, 'التواصل مع الأهل', 'family', { dur: 30, link: 'family' });
  const wEnd = dayType === 'off' ? P.isha + 120 : toMin(S.workEnd);
  add('review', wEnd - 15, 'مراجعة اليوم وتخطيط الغد', 'general', { dur: 15 });
  add('sleep', toMin(S.sleep), 'الاستعداد للنوم (أذكار النوم)', 'faith');
  B.sort((a, b) => a.t - b.t || (a.span ? -1 : 0));
  return { blocks: B, prayers: P, season: se };
}

const WEEKDAYS = [['الاحد', 0], ['الأحد', 0], ['الاثنين', 1], ['الإثنين', 1], ['الثلاثاء', 2], ['الاربعاء', 3], ['الأربعاء', 3], ['الخميس', 4], ['الجمعه', 5], ['الجمعة', 5], ['السبت', 6]];

/* now = localNow(...)  |  prayerAt(dateKey) => {fajr,...} (دقائق) */
function parseTask(text, now, prayerAt) {
  const s = normAr(text);
  let date = null, time = null, repeat = 'none', rest = ' ' + s + ' ';
  const mk = src => new RegExp('(?<![\\u0621-\\u064A])(?:' + src + ')(?![\\u0621-\\u064A])');
  const cut = src => { const re = mk(src); const m = rest.match(re); if (m) rest = rest.replace(re, ' '); return m; };
  const today = dateKey(now);
  if (cut('كل يوم')) repeat = 'daily'; else if (cut('كل (?:اسبوع|أسبوع)')) repeat = 'weekly';
  let m;
  if (cut('بعد (?:بكره|بكرة|غد|غدا)')) date = addDays(today, 2);
  else if (cut('بكره|بكرة|غدا|غداً|غد')) date = addDays(today, 1);
  else if (cut('الليله|الليلة|اليوم|هاليوم|هذا اليوم')) date = today;
  else if ((m = rest.match(/بعد (\d{1,2}) (?:ايام|أيام|يوم)/))) { date = addDays(today, +m[1]); rest = rest.replace(m[0], ' '); }
  else if (cut('(?:الاسبوع|الأسبوع) (?:الجاي|القادم|الجاى)')) date = addDays(today, 7);
  else {
    for (const [w, n] of WEEKDAYS) {

  }

  let prayerRel = null;
  for (const [w, k] of PRAYER_WORDS) {
    const re = mk('(بعد|قبل|عند|وقت)(?: صلاة| اذان| أذان)? ' + w);

  if (m) { h = +m[1]; mi = m[2] ? +m[2] : 0; rest = rest.replace(m[0], ' '); }
  else {
    const mw = rest.match(/(?:الساعه|الساعة) ([ء-ي]+)(?: (?:الا|إلا) (ربع|ثلث))?/);
    if (mw && NUM_WORDS[mw[1]] != null) { h = NUM_WORDS[mw[1]]; if (mw[2]) { mi = mw[2] === 'ربع' ? 45 : 40; h = h - 1 || 12; } rest = rest.replace(mw[0], ' '); }

  else if (cut('ظهرا|ظهراً')) period = 'noon';
  else if (cut('عصرا|عصراً|مساء|مساءً|بالليل|ليلا|ليلاً|الليل|بالمساء')) period = 'pm';
  else if (h != null && !prayerRel) {
    if (cut('الظهر')) period = 'noon'; else if (cut('العصر|المغرب|العشاء')) period = 'pm';
  }
  if (h != null) {
    if (cut('و ?نص|ونصف|و ?نصف')) mi = 30; else if (cut('و ?ربع')) mi = 15; else if (cut('و ?ثلث')) mi = 20;
    if (period === 'pm' && h < 12) h += 12;
    else if (period === 'noon') { if (h < 7) h += 12; }
    else if (period === 'am') { if (h === 12) h = 0; }
    else if (h >= 1 && h <= 6) h += 12;
    time = `${pad(h % 24)}:${pad(mi)}`;
  } else if (prayerRel && prayerAt) {
    const dk = date || today, P = prayerAt(dk);
    time = hhmm(P[prayerRel.k] + (prayerRel.rel === 'قبل' ? -15 : prayerRel.rel === 'بعد' ? 15 : 0));
    rest = rest.replace(prayerRel.re, ' '); date = dk;
  }
  if (time && !date) date = toMin(time) > now.min ? today : addDays(today, 1);

  rest = rest.replace(/\s+/g, ' ').trim().replace(/^(?:ان|أن|اني|أني|إني|ب|في|ف|عند)\s+/, '').replace(/^[\-–:،.\s]+|[\-–:،.\s]+$/g, '');
  return { title: rest || text.trim(), date, time, repeat, cat: guessCat(s) };
}

function localChat(text) {
  const t = normAr(text), n = NOW(), k = dateKey(n), c = cfg();
  if (/^(ضيف|اضف|أضف|ذكرني|سجل|سجّل|ضيفلي)/.test(t)) {
    const p = parseTask(text, n, kk => prayersFor(kk, c));
    ST.tasks.push({ id: uid(), title: p.title, date: p.date, time: p.time, cat: p.cat, repeat: p.repeat, remind: 0, done: false }); save();
    return `أضفت المهمة: «${p.title}»${p.date ? ' · ' + relDate(p.date, k) : ''}${p.time ? ' · ' + fmt12(toMin(p.time)) : ''}${p.repeat !== 'none' ? ' · متكررة' : ''}.`;
  }
  const pm = t.match(/(الفجر|الظهر|العصر|المغرب|العشاء)/);
  if (pm && /(متى|كم|وقت|موعد|اذان|أذان)/.test(t)) {
    const key = PRAYER_WORDS.find(x => x[0] === pm[1])[1], P = prayersFor(k, c);
    return `صلاة ${pm[1]} اليوم في ${cityName()} الساعة ${fmt12(P[key])}.`;
  }
  if (/(مهامي|وش عندي|ايش عندي|شو عندي|مهام)/.test(t) && !/(اقترح|رتب|ساعد|فكرة)/.test(t)) {
    const week = /(الاسبوع|الأسبوع)/.test(t), d = /(بكره|بكرة|غدا)/.test(t) ? addDays(k, 1) : k;
    const L = ST.tasks.filter(x => !x.done && (week ? x.date && x.date >= k && x.date <= addDays(k, 7) : x.date === d || (d === k && x.date && x.date < k))).sort((a, b) => (a.date + (a.time || '')).localeCompare(b.date + (b.time || '')));
    if (!L.length) return week ? 'لا توجد مهام مسجّلة لهذا الأسبوع.' : `لا توجد مهام مسجّلة ${d === k ? 'لليوم' : 'ليوم غد'}.`;

  }
  return null;
}

let chatBusy = false;
async function sendChat(text) {
  if (!text || chatBusy) return;
  ST.chat.push({ r: 'u', t: text });

  if (loc) { ST.chat.push({ r: 'a', t: loc }); save(); render(); scrollEnd(); return; }
  if (!aiReady()) { ST.chat.push({ r: 'a', t: errMsg({ code: 'no_ai' }) }); save(); render(); scrollEnd(); return; }
  chatBusy = true; ST.chat.push({ r: 'a', t: 'جارٍ التفكير…', tmp: true }); render(); scrollEnd();
  const hist = ST.chat.slice(0, -1).slice(-9).map(m => ({ role: m.r === 'u' ? 'user' : 'assistant', content: m.t }));
  while (hist.length && hist[0].role !== 'user') hist.shift();
  try {
    const out = await askAI(hist, SYS_CHAT(), { onText: t => { const el = $('#msg-last'); if (el) el.innerHTML = md(t.replace(/```tasks[\s\S]*$/, '')); } });
    const m = out.match(/```tasks\s*([\s\S]*?)```/); let tasks = [];
    if (m) { try { tasks = JSON.parse(m[1]).filter(x => x && x.title); } catch (e) { } }
    ST.chat[ST.chat.length - 1] = { r: 'a', t: out.replace(/```tasks[\s\S]*?```/, '').trim() || 'تمّ.', tasks };
  } catch (e) { ST.chat[ST.chat.length - 1] = { r: 'a', t: errMsg(e) }; }
  chatBusy = false; save(); render(); scrollEnd();
}

    ${fld('جدول الموسم', selb('settings.season', [['auto', 'تلقائي (أبريل–سبتمبر صيف)'], ['summer', 'صيفي دائماً'], ['winter', 'شتوي دائماً']]))}
    ${fld('طبيعة الصباح الافتراضية', selb('settings.defaultDay', [['free', 'صباح فاضي'], ['install', 'فيه تركيبات'], ['off', 'إجازة']]))}
    ${fld('المظهر', selb('settings.theme', [['auto', 'حسب الجهاز'], ['light', 'فاتح'], ['dark', 'داكن']]))}
    ${fld('مساحة آمنة أسفل الشاشة (لشريط المنصة أو شارتها)', selb('settings.bottomSpace', [['auto', 'تلقائي'], ['0', 'بدون'], ['32', 'صغيرة'], ['48', 'متوسطة'], ['64', 'كبيرة'], ['88', 'كبيرة جداً']]))}</section>
  <section class="card gap"><h2>${ic('bell')}<span>الاستيقاظ</span></h2><div class="grid2">${fld('الصيف', inp('settings.wake.summer', 'time'))}${fld('الشتاء', inp('settings.wake.winter', 'time'))}</div></section>
  <section class="card gap"><h2>${ic('users')}<span>مدرسة الولد</span></h2>
    <div class="lab">أيام الدراسة</div><div class="chips">${DAYN.map((d, i) => `<button class="chip ${c.schoolDays.includes(i) ? 'on' : ''}" data-act="sday" data-v="${i}">${d}</button>`).join('')}</div>
    <div class="grid2">${fld('الذهاب (صيف)', inp('settings.drop.summer', 'time'))}${fld('الذهاب (شتاء)', inp('settings.drop.winter', 'time'))}${fld('الخروج (صيف)', inp('settings.pick.summer', 'time'))}${fld('الخروج (شتاء)', inp('settings.pick.winter', 'time'))}</div>
    ${fld('مدة الذهاب والعودة (دقيقة)', inp('settings.driveMin', 'number'))}</section>
  <section class="card gap"><h2>${ic('factory')}<span>الدوام والغداء والنوم</span></h2><div class="grid2">${fld('الغداء', inp('settings.lunch', 'time'))}${fld('التجهّز للدوام', inp('settings.leave', 'time'))}${fld('بداية الدوام', inp('settings.workStart', 'time'))}${fld('نهاية الدوام', inp('settings.workEnd', 'time'))}</div>${fld('موعد الاستعداد للنوم', inp('settings.sleep', 'time'))}</section>
  <section class="card"><h2>${ic('bell')}<span>التنبيهات</span></h2>
    ${tog('settings.alerts.wake', 'الاستيقاظ')}${tog('settings.alerts.pick', 'توصيل واستلام الولد')}${tog('settings.alerts.work', 'الذهاب للدوام')}${tog('settings.alerts.wird', 'ورد القرآن')}
    <div class="sline"><span class="grow">صوت المهام</span><select style="width:150px" data-bind="settings.sounds.task">${soundOptions(c.sounds.task)}</select></div>
    <div class="sline"><span class="grow">صوت فقرات البرنامج</span><select style="width:150px" data-bind="settings.sounds.block">${soundOptions(c.sounds.block)}</select></div>
    <div class="sline"><span class="grow">صوت الاستيقاظ</span><select style="width:150px" data-bind="settings.sounds.wake">${soundOptions(c.sounds.wake)}</select></div>
    <div class="row wrap" style="margin-top:8px"><button class="btn ghost" data-act="testalert">${ic('play')} تجربة تنبيه</button></div></section>
  <section class="card gap"><h2>${ic('ai')}<span>الذكاء الاصطناعي</span></h2>
    <div class="note">الحالة: ${modeTxt}. ${SAMPLE ? 'داخل Claude يعمل الذكاء دون مفتاح.' : 'لتفعيله خارج Claude أضف مفتاحك أدناه.'}</div>
    ${fld('المزوّد', `<select data-ai="provider">${[['anthropic', 'Anthropic (Claude)'], ['openai', 'OpenAI أو متوافق'], ['gemini', 'Google Gemini']].map(([v, l]) => `<option value="${v}" ${a.provider === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`)}
    ${fld('مفتاح API', `<input type="password" data-ai="key" value="${esc(a.key || '')}" placeholder="يُحفظ على جهازك فقط" autocomplete="off">`)}
    ${fld('اسم النموذج (اختياري)', `<input type="text" data-ai="model" value="${esc(a.model || '')}" placeholder="${a.provider === 'openai' ? 'gpt-4o-mini' : a.provider === 'gemini' ? 'gemini-flash-latest' : 'claude-haiku-5-5'}">`)}
    ${a.provider === 'openai' ? fld('عنوان الخدمة (اختياري)', `<input type="url" data-ai="base" value="${esc(a.base || '')}" placeholder="https://api.openai.com/v1">`) : ''}
    <button class="btn ghost block" id="aitest" data-act="aitest">${ic('ai')} اختبار الاتصال</button>
    <div class="small muted">المفتاح لا يدخل في النسخة الاحتياطية. استخدم نموذجاً اقتصادياً لتقليل التكلفة. الاتصال بالمفتاح يعمل عند فتح التطبيق خارج Claude.</div></section>
  <section class="card gap"><h2>${ic('copy')}<span>نسخة احتياطية</span></h2><div class="row wrap"><button class="btn grow" data-act="export">تصدير بياناتي</button><label class="btn ghost grow" style="cursor:pointer">استيراد<input id="impfile" type="file" accept="application/json,.json" style="display:none"></label></div><div class="small muted">بياناتك محفوظة في هذا المتصفح. صدّر نسخة من وقت لآخر.</div>
    <button class="btn danger block" data-act="reset" id="rstbtn">مسح كل البيانات</button></section>`;
}

/* ---- الرسم الرئيسي ---- */
const VIEWS = { today: vToday, tasks: vTasks, prayer: vPrayer, wird: vWird, grow: vGrow, ai: vAI, settings: vSettings };
function render() {
  const m = $('#main'); if (!m) return; const st = m.scrollTop;
  try { m.innerHTML = VIEWS[tab](); } catch (e) { m.innerHTML = `<div class="card">حدث خطأ في العرض: ${esc(e.message)}</div>`; console.error(e); }
  $('#nav').innerHTML = NAV.map(([id, l, i]) => `<button class="${tab === id ? 'on' : ''}" data-act="goto" data-v="${id}" aria-label="${l}">${ic(i)}<span>${l}</span></button>`).join('');
  const k = TODAY(); $('#sub').textContent = `${fmtG(k)} · ${fmtH(k)} هـ`;
  m.scrollTop = st; updCd();
}
function updCd() {
  const el = $('#cd'); if (!el) return; let s = Math.max(0, Math.round((+el.dataset.at - Date.now()) / 1000));
  el.textContent = `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`;
}
function go(t) { tab = t; closeSheet(); render(); $('#main').scrollTop = 0; }

/* ---- الأحداث ---- */
const ACT = {
  goto: el => go(el.dataset.v), gosettings: () => go(tab === 'settings' ? 'today' : 'settings'),
  blk: el => toggleBlock(el.dataset.k, el.dataset.v),
  daytype: el => { ST.dayType[TODAY()] = el.dataset.v; save(); render(); },
  ttoggle: el => toggleTask(el.dataset.id), tedit: el => openTask(el.dataset.id || null),
  tf: el => { taskF = el.dataset.v; render(); }, qex: el => { const i = $('#qa'); i.value = el.dataset.v; i.focus(); },
  qadd: () => {
    const i = $('#qa'), txt = i.value.trim(); if (!txt) return;
    const p = parseTask(txt, NOW(), k => prayersFor(k, cfg()));
    ST.tasks.push({ id: uid(), title: p.title, date: p.date, time: p.time, cat: p.cat, repeat: p.repeat, remind: 0, done: false });
    taskF = p.date ? (p.date <= TODAY() ? 'today' : 'up') : 'none'; save(); render();
    say(`أُضيفت: ${p.title}${p.date ? ' · ' + relDate(p.date, TODAY()) : ''}${p.time ? ' · ' + fmt12(toMin(p.time)) : ''}`);
  },
  tsave: el => {
    const id = el.dataset.id, o = { title: $('#tk-title').value.trim(), date: $('#tk-date').value || null, time: $('#tk-time').value || null, cat: $('#tk-cat').value, remind: +$('#tk-rem').value, repeat: $('#tk-rep').value, sound: $('#tk-snd').value || null, notes: $('#tk-note').value };
    if (!o.title) return say('اكتب عنوان المهمة', 'warn');
    if (id) Object.assign(ST.tasks.find(x => x.id === id), o); else ST.tasks.push({ id: uid(), done: false, ...o });
    save(); closeSheet(); render();
  },
  tdel: el => { ST.tasks = ST.tasks.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  skilldone: () => { const k = TODAY(); if (ST.skillLog[k]) delete ST.skillLog[k]; else ST.skillLog[k] = true; save(); render(); },
  mic: el => micClick(el.dataset.for, el),
  testsnd: el => startRing(el.dataset.v in SOUND_NAMES || el.dataset.v.startsWith('c:') ? el.dataset.v : cfg().sounds[el.dataset.v], 1),
  sndel: el => { SND = SND.filter(x => x.id !== el.dataset.id); wr(LSSND, SND); for (const k in cfg().sounds) if (cfg().sounds[k] === el.dataset.id) cfg().sounds[k] = 'bell'; save(); render(); },
  notifperm: () => { try { Notification.requestPermission().then(() => render()); } catch (e) { } },
  testalert: () => fire({ id: 'test' + Date.now(), title: 'هذا تنبيه تجريبي', body: 'إن سمعت الصوت فكل شيء يعمل', sound: cfg().sounds.task, loop: false }),
  wirddone: () => toggleBlock(TODAY(), 'wird'),
  wpace: el => { ST.wird.pace = +el.dataset.v; save(); render(); },
  wnew: () => { ST.wird.khatmat++; ST.wird.pos = 0; ST.wird.days = {}; ST.wird.tafsir = {}; save(); render(); },
  tafsir: async el => {
    const w = ST.wird, p = wirdPortion(w.pos, w.pace); if (p.finished) return; el.disabled = true; const out = $('#tafout'); out.innerHTML = '<div class="muted small">جارٍ تحضير التفسير…</div>';
    const sys = 'أنت معلّم يشرح معاني القرآن الكريم لمسلم عادي بلغة عربية فصحى مبسطة. اعتمد على أقوال المفسرين المعتبرين (السعدي، ابن كثير، الطبري، الميسّر). لا تنقل الآيات كاملة. لخّص المعاني في ٥ إلى ٨ نقاط مرتبة حسب السور والآيات مع ذكر أرقام الآيات التقريبية، ثم اختم بفائدة عملية واحدة للتطبيق اليوم. إن لم تتأكد من معنى فاذكر ذلك ولا تختلق تفسيراً.';
    try {
      const text = await askAI([{ role: 'user', content: `ورد اليوم: ${p.label}، من ${p.startTxt} إلى ${p.endTxt}. اكتب التفسير الميسّر.` }], sys, { max: 1800, onText: t => { out.innerHTML = md(t); } });
      w.tafsir[`${w.pos}|${w.pace}`] = text; const ks = Object.keys(w.tafsir); if (ks.length > 6) delete w.tafsir[ks[0]]; save();
    } catch (e) { out.innerHTML = `<div class="note">${esc(errMsg(e))}</div>`; }
    el.disabled = false;
  },
  gt: el => { growT = el.dataset.v; render(); },
  lesson: async el => {
    const sk = SKILLS[dayOfYear(TODAY()) % SKILLS.length], out = $('#lesout'); el.disabled = true; out.innerHTML = '<div class="muted small">جارٍ التحضير…</div>';
    try { out.innerHTML = md(await askAI([{ role: 'user', content: `المهارة: ${sk[0]}. ${sk[1]}` }], 'أنت مدرّب عملي لصاحب معرض ديكور ومركّب ديكورات في السعودية. اكتب درساً سريعاً بالعربية: ٥ نقاط أساسية مختصرة، ثم تمرين عملي واحد يمكن تنفيذه اليوم في ٢٠ دقيقة. بلا مقدمات.', { quick: true, max: 900 })); } catch (e) { out.innerHTML = `<div class="note">${esc(errMsg(e))}</div>`; }
    el.disabled = false;
  },
  ideas: async el => {
    const out = $('#ideaout'); el.disabled = true; out.innerHTML = '<div class="muted small">جارٍ التفكير…</div>';
    try { out.innerHTML = md(await askAI([{ role: 'user', content: `أنا صاحب معرض ديكور في ${cityName()} وأعمل في تركيب الديكورات (بانوهات جدارية، جبس، باركيه، ألواح رخام بديل، إضاءة). اقترح ٦ منتجات أو خدمات جديدة يمكن إضافتها للمعرض، ولكل منها: سبب مناسبتها، نوع المصنع أو المورّد الذي أبحث عنه، وأول خطوة.` }], 'أنت مستشار تجاري عملي للمحلات الصغيرة. أجب بالعربية بإيجاز.', { max: 1400 })); } catch (e) { out.innerHTML = `<div class="note">${esc(errMsg(e))}</div>`; }
    el.disabled = false;
  },
  supopen: el => { if (el.closest('.scrim') == null && tab !== 'grow') { growT = 'sup'; tab = 'grow'; render(); } openSup(el.dataset.id || null); },
  supsave: el => {
    const id = el.dataset.id, o = { name: $('#sp-name').value.trim(), product: $('#sp-prod').value.trim(), contact: $('#sp-con').value.trim(), status: $('#sp-st').value, next: $('#sp-next').value || null, notes: $('#sp-note').value };
    if (!o.name) return say('اكتب اسم المصنع', 'warn');
    if (id) Object.assign(ST.suppliers.find(x => x.id === id), o); else ST.suppliers.push({ id: uid(), ...o });
    save(); closeSheet(); render();
  },
  supdel: el => { ST.suppliers = ST.suppliers.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  copymsg: async () => { const ta = $('#msgtxt'); try { await navigator.clipboard.writeText(ta.value); say('تم النسخ'); } catch (e) { ta.focus(); ta.select(); say('حدّد النص وانسخه يدوياً', 'warn'); } },
  polish: async el => {
    const ta = $('#msgtxt'); el.disabled = true;
    try { ta.value = (await askAI([{ role: 'user', content: ta.value }], 'حسّن صياغة رسالة واتساب هذه لتكون مهذبة ومختصرة ومهنية بالعربية لطلب كتالوج من مصنع. أعد الرسالة فقط دون شرح.', { quick: true, max: 600 })).trim(); } catch (e) { say(errMsg(e), 'warn'); }
    el.disabled = false;
  },
  famopen: el => openFam(el.dataset.id || null), famquick: el => openFam(null, el.dataset.v),
  famsave: el => {
    const id = el.dataset.id, o = { name: $('#fm-name').value.trim(), rel: $('#fm-rel').value.trim(), freq: +$('#fm-freq').value };
    if (!o.name) return say('اكتب الاسم', 'warn');
    if (id) Object.assign(ST.family.find(x => x.id === id), o); else ST.family.push({ id: uid(), last: null, ...o });
    save(); closeSheet(); render();
  },
  famdel: el => { ST.family = ST.family.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); },
  famdone: el => { const f = ST.family.find(x => x.id === el.dataset.id); if (f) { f.last = TODAY(); save(); render(); say('بارك الله فيك، صلة الرحم'); } },
  chip: el => sendChat(el.dataset.v), chat: () => { const i = $('#ci'), v = i.value.trim(); i.value = ''; sendChat(v); },
  chatclr: () => { ST.chat = []; save(); render(); },
  addsug: el => {
    const m = ST.chat[+el.dataset.i]; if (!m || !m.tasks) return; const today = TODAY();
    for (const t of m.tasks) ST.tasks.push({ id: uid(), title: String(t.title), date: /^\d{4}-\d{2}-\d{2}$/.test(t.date || '') ? t.date : null, time: /^\d{2}:\d{2}$/.test(t.time || '') ? t.time : null, cat: CATN[t.cat] ? t.cat : 'general', repeat: 'none', remind: 0, done: false });
    m.tasks = []; save(); render(); say('أُضيفت المهام إلى قائمتك');
  },
  sday: el => { const d = +el.dataset.v, a = cfg().schoolDays; cfg().schoolDays = a.includes(d) ? a.filter(x => x !== d) : [...a, d].sort(); save(); render(); },
  aitest: async el => {
    el.disabled = true; const old = el.innerHTML; el.textContent = 'جارٍ الاختبار…';
    try { const t = await askAI([{ role: 'user', content: 'أجب بكلمة واحدة فقط: جاهز' }], 'أنت مساعد مختصر.', { quick: true, max: 30 }); say('الاتصال ناجح: ' + t.trim().slice(0, 40)); }
    catch (e) { showToast({ title: 'فشل الاتصال', body: errMsg(e), kind: 'warn', ttl: 9000 }); }
    el.disabled = false; el.innerHTML = old;
  },
  export: () => exportData(),
  reset: el => { if (el.dataset.sure) { ST = JSON.parse(JSON.stringify(DEF)); wr(LS, ST); SND = []; wr(LSSND, SND); applyTheme(); go('today'); say('تم المسح'); } else { el.dataset.sure = 1; el.textContent = 'اضغط مرة أخرى للتأكيد'; setTimeout(() => { if (el.isConnected) { delete el.dataset.sure; el.textContent = 'مسح كل البيانات'; } }, 4000); } }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || !$('#app').contains(el)) return; actx(); const f = ACT[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'sndfile' && t.files[0]) {
    const f = t.files[0]; if (f.size > 2.5 * 1048576) { say('الملف أكبر من ٢٫٥ ميجابايت', 'warn'); return; }
    const fr = new FileReader(); fr.onload = () => { SND.push({ id: 'c:' + uid(), name: f.name.replace(/\.[^.]+$/, ''), data: fr.result }); if (!wr(LSSND, SND)) { SND.pop(); say('مساحة التخزين لا تكفي لهذا الملف', 'warn'); } else say('أُضيف الصوت'); render(); }; fr.readAsDataURL(f); return;
  }
  if (t.id === 'impfile' && t.files[0]) { importData(t.files[0]); return; }
  if (t.dataset.ai) { const a = AIcfg(); a[t.dataset.ai] = t.value.trim(); if (t.dataset.ai === 'provider') a.model = ''; if (t.dataset.ai === 'key') { const d = detectProvider(a.key); if (d && d !== a.provider) { a.provider = d; a.model = ''; wr(LSAI, a); render(); say('تم اختيار المزوّد تلقائياً حسب المفتاح'); return; } } wr(LSAI, a); if (t.dataset.ai === 'provider') render(); else { document.body.classList.toggle('hidden-mic', !micAvail()); } return; }
  if (t.dataset.bind) {
    const p = t.dataset.bind; let v = t.type === 'checkbox' ? t.checked : t.dataset.num ? +t.value : t.value;
    setP(p, v);
    if (p === 'settings.city') { const C = CITIES[v]; if (C && v !== 'custom') { cfg().lat = C[1]; cfg().lng = C[2]; cfg().tz = C[3]; } }
    if (p === 'settings.theme' || p === 'settings.bottomSpace') applyTheme();
    save(); render();
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'qa') { e.preventDefault(); ACT.qadd(); } else if (e.target.id === 'ci') { e.preventDefault(); ACT.chat(); }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); render(); } });

/* ---- الإقلاع ---- */
applyTheme(); pruneFired(); render(); initCaps(); tick();
setInterval(tick, 5000);
setInterval(() => { updCd(); const n = NOW(); if (n.min !== lastMin) { lastMin = n.min; const a = document.activeElement; if ((tab === 'today' || tab === 'prayer') && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) && !$('.scrim')) render(); } }, 1000);
</script>

</body></html>
